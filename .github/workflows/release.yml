name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test the tag before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check clreview tests
      - name: Tests
        run: uv run pytest -q --ignore=adws

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Verify artifacts
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python -m pip install dist/*.whl
          clreview-server --version
          python - <<'PY'
          import importlib.resources as r
          assert r.files("clreview").joinpath("web/index.html").is_file()
          assert r.files("clreview").joinpath("fixtures/demo/pl.json").is_file()
          print("artifacts ok")
          PY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
