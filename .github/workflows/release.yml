name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test the tag before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check clreview tests
      - name: Tests
        run: uv run pytest -q --ignore=adws

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"

      - name: Build artifacts
        run: |
          uv build
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Verify artifacts
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          uv venv /tmp/pkg-check
          uv pip install --python /tmp/pkg-check/bin/python dist/*.whl
          /tmp/pkg-check/bin/clreview-server --version
          /tmp/pkg-check/bin/python - <<'PY'
          import importlib.resources as r
          assert r.files("clreview").joinpath("web/index.html").is_file()
          assert r.files("clreview").joinpath("fixtures/demo/pl.json").is_file()
          print("artifacts ok")
          PY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
