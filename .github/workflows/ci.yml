name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
      - name: Lint
        run: uv run ruff check clreview tests

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync
      - name: Browser for the web smoke test
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2  # puts google-chrome on PATH, which the skip check finds
      - name: Browser is really installed
        run: |
          node --version
          google-chrome --version
      - name: Byte-compile
        run: uv run python -m compileall -q clreview
      - name: Tests
        run: |
          set -o pipefail
          uv run pytest -q --ignore=adws -rs 2>&1 | tee /tmp/pytest.log
          if grep -q "web smoke test needs node" /tmp/pytest.log; then
            echo "::error::web smoke test was skipped - no chromium on the runner"
            exit 1
          fi

  docker:
    name: docker image builds and serves /api/health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -t cl-review-platform:ci .
      - name: Run and wait for the healthcheck
        run: |
          set -o pipefail
          docker run -d --name rev -p 127.0.0.1:8765:8765 \
            -e CLREVIEW_DB=/data/clreview.db cl-review-platform:ci --demo
          code=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' http://127.0.0.1:8765/api/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker inspect --format '{{.State.Health.Status}}' rev
          test "$code" = "200"
      - name: Container log on failure
        if: failure()
        run: docker logs rev

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Build sdist and wheel
        run: uv build
      - name: Verify wheel contents and entry point
        run: |
          uv venv /tmp/pkg-check
          uv pip install --python /tmp/pkg-check/bin/python dist/*.whl
          /tmp/pkg-check/bin/clreview-server --version
          /tmp/pkg-check/bin/python - <<'PY'
          import importlib.resources as r
          assert r.files("clreview").joinpath("web/index.html").is_file()
          assert r.files("clreview").joinpath("fixtures/demo/pl.json").is_file()
          print("wheel assets ok")
          PY
      - name: Smoke-run packaged server
        run: |
          /tmp/pkg-check/bin/clreview-server --demo --port 8899 --db /tmp/smoke.db >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8899/api/health || true)
            [ "$code" = "200" ] && break
            sleep 0.3
          done
          test "$code" = "200"
          curl -s -o /tmp/index.html -w '%{http_code}' http://127.0.0.1:8899/ | grep -q 200
          kill %1 2>/dev/null || true
