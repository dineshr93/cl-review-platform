services:
  clreview:
    build: .
    image: cl-review-platform:latest
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      CLREVIEW_TOKEN: ${CLREVIEW_TOKEN:-}
      BLACKDUCK_URL: ${BLACKDUCK_URL:-}
      BLACKDUCK_TOKEN: ${BLACKDUCK_TOKEN:-}
      FOSSOLOGY_URL: ${FOSSOLOGY_URL:-}
      FOSSOLOGY_TOKEN: ${FOSSOLOGY_TOKEN:-}
    volumes:
      - clreview-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
volumes:
  clreview-data:
