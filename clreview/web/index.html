<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CL Review</title>
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131820" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%23245bdb'/><path d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="progress" aria-hidden="true"><i></i></div>
<header class="topbar">
  <strong>Copyright &amp; License Review</strong>
  <span class="sub">SL evidence → human review → PL synchronization</span>
  <label class="reviewer">Reviewer <input id="reviewer" placeholder="your name" autocomplete="name" aria-describedby="reviewer-error" required><span id="reviewer-error" class="field-error" role="alert" hidden>Enter your name here first, then repeat the action.</span></label>
  <button id="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false"><svg class="ico-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.4"/><path d="M8 .8v1.9M8 13.3v1.9M.8 8h1.9M13.3 8h1.9M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4"/></svg><svg class="ico-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 9.8A5.8 5.8 0 0 1 6.2 2.8a5.8 5.8 0 1 0 7 7z"/></svg></button>
</header>
<div class="layout">
  <nav class="sidebar">
    <label class="side-label" for="mapping-select">Active mapping</label>
    <select id="mapping-select"></select>
    <div class="navlinks">
      <a href="#/overview" data-view="overview"><svg class="nav-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2"/><rect x="9" y="1.5" width="5.5" height="3" rx="1.2"/><rect x="9" y="6" width="5.5" height="8.5" rx="1.2"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2"/></svg><span>Project overview</span></a>
      <a href="#/queue" data-view="queue"><svg class="nav-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 8h12M2 12.5h8"/></svg><span>Review queue</span></a>
      <a href="#/history" data-view="history"><svg class="nav-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.8"/></svg><span>Synchronization history</span></a>
      <a href="#/deploy" data-view="deploy"><svg class="nav-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11.5V2.5M8 2.5L4.8 5.7M8 2.5l3.2 3.2M2.5 13.5h11"/></svg><span>Source deployment</span></a>
    </div>
    <div class="side-actions">
      <button id="refresh-btn" title="Retrieve fresh snapshots; review decisions are preserved"><span class="btn-spin" aria-hidden="true"></span><span class="btn-label">Refresh snapshots</span></button>
    </div>
    <div id="side-status" class="side-status"></div>
  </nav>
  <main id="main" aria-live="polite">
    <section id="view-overview" class="view"></section>
    <section id="view-queue" class="view hidden"></section>
    <section id="view-workspace" class="view hidden"></section>
    <section id="view-history" class="view hidden"></section>
    <section id="view-deploy" class="view hidden"></section>
  </main>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>
<script src="workspace.js"></script>
<script src="app.js"></script>
</body>
</html>
