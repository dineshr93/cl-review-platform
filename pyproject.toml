[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cl-review-platform"
version = "1.0.0"
description = "Human-gated copyright and license data review with controlled SL-to-PL synchronization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dineshr93" }]
keywords = ["copyright", "license", "compliance", "sbom", "fossology", "blackduck", "scancode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/dineshr93/cl-review-platform"
Documentation = "https://github.com/dineshr93/cl-review-platform/tree/main/docs"
Issues = "https://github.com/dineshr93/cl-review-platform/issues"

[project.scripts]
clreview-server = "clreview.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]   # keep `make test` from collecting adws/adw_*_test.py (SSSF scripts, not tests)
addopts = "--cov=clreview --cov-report=term-missing --cov-fail-under=75"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]     # pycodestyle errors + pyflakes: real defects, not style churn
ignore = ["E741", "E731"]            # ambiguous name `l`, lambda assignment: renaming is out of scope

[tool.setuptools]
packages = ["clreview", "clreview.connectors"]

[tool.setuptools.package-data]
clreview = ["web/*.html", "web/*.css", "web/*.js", "fixtures/demo/*.json"]
